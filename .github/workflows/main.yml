name: Build and Deploy

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore GameOverlay.sln
    
    - name: Set build version
      shell: pwsh
      run: |
        if ("${{ github.ref }}" -match "^refs/tags/") {
          # For tags: extract version from tag name (e.g., v1.0.0 -> 1.0.0)
          $version = "${{ github.ref_name }}" -replace '^v', ''
        } else {
          # For commits: use dev version with run number
          $version = "0.0.0-dev.${{ github.run_number }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_ENV
    
    - name: Build solution in Release mode
      run: dotnet build GameOverlay.sln --configuration Release -p:Version=$env:VERSION --no-restore
    
    - name: Create release artifacts
      run: |
        # Create release directory
        New-Item -ItemType Directory -Path "release" -Force
        
        $sourcePath = "GameHelper\bin\Release\net10.0"
        if (Test-Path $sourcePath) {
          Copy-Item -Path "$sourcePath\*" -Destination "release\" -Recurse -Force
        }
        
        Compress-Archive -Path "release\*" -DestinationPath "GameHelper-$env:VERSION.zip"
      shell: pwsh
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          GameHelper-${{ env.VERSION }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ env.VERSION }}
        path: release/
        retention-days: 30
